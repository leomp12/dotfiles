# yazi — moldura na paleta navy dos wallpapers/Hyprland (README: "Paleta").
# Só sobrescreve o preset; as cores dos arquivos seguem as ANSI do kitty, como ls e p10k.
#   ink #0b1628 · surface #2e4570 · dim #2a3d61 · muted #8195b8 · accent #9db4d6 · urgent #e0707a

[mgr]
cwd          = { fg = "#9db4d6", bold = true }
border_style = { fg = "#2a3d61" }
find_keyword = { fg = "#9db4d6", bold = true, underline = true }

marker_selected = { fg = "#9db4d6", bg = "#9db4d6" }
count_selected  = { fg = "#0b1628", bg = "#9db4d6" }

[indicator]
parent  = { bg = "#2e4570" }
current = { fg = "#e6edf7", bg = "#2a3d61", bold = true }
preview = { underline = true }

[tabs]
active   = { fg = "#0b1628", bg = "#9db4d6", bold = true }
inactive = { fg = "#9db4d6", bg = "#2e4570" }

[mode]
normal_main = { fg = "#0b1628", bg = "#9db4d6", bold = true }
normal_alt  = { fg = "#9db4d6", bg = "#2e4570" }
select_main = { fg = "#0b1628", bg = "#e0c088", bold = true }
select_alt  = { fg = "#e0c088", bg = "#2e4570" }
unset_main  = { fg = "#0b1628", bg = "#e0707a", bold = true }
unset_alt   = { fg = "#e0707a", bg = "#2e4570" }

[status]
perm_sep = { fg = "#8195b8" }

[which]
border           = { fg = "#2a3d61" }
cand             = { fg = "#9db4d6" }
rest             = { fg = "#8195b8" }
desc             = { fg = "#c8d3e6" }
separator_style  = { fg = "#8195b8" }

[confirm]
border = { fg = "#9db4d6" }
title  = { fg = "#9db4d6" }

[spot]
border = { fg = "#9db4d6" }
title  = { fg = "#9db4d6" }

[pick]
border = { fg = "#9db4d6" }
active = { fg = "#9db4d6", bold = true }

[input]
border = { fg = "#9db4d6" }

[cmp]
border = { fg = "#9db4d6" }

[tasks]
border  = { fg = "#9db4d6" }
hovered = { fg = "#9db4d6", bold = true }

[help]
border  = { fg = "#9db4d6" }
chord   = { fg = "#9db4d6" }

# Mesmas regras do preset, com as cores fortes do terminal (azul, amarelo...) trocadas por tons da paleta.
# A lista substitui a inteira do preset, então todas as regras precisam estar aqui.
[filetype]
rules = [
	{ mime = "**/image/*", fg = "#d9c39a" },
	{ mime = "**/{audio,video}/*", fg = "#c3a6d9" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e0707a" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#8fc7c9" },
	{ mime = "vfs/{absent,stale}", fg = "#8195b8" },
	{ url = "*", is = "orphan", bg = "#e0707a" },
	{ url = "*", is = "exec"  , fg = "#9fd0a0" },
	{ url = "*", is = "dummy", bg = "#e0707a" },
	{ url = "*/", is = "dummy", bg = "#e0707a" },
	{ url = "*/", fg = "#8199bd", bold = true },
	{ url = "*", fg = "#dbe4f2" },
]
