# hyprlock — fundo preto (sem screenshot do desktop borrado).
# Destravar remoto: ssh <host> .bin/unlock-screen
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(000000)
}

input-field {
    monitor =
    size = 20%, 5%
    fade_on_empty = false
    placeholder_text = password
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    position = 0, 120
    halign = center
    valign = center
}
