# hypridle — leo-arch-dev: só trava, nunca suspende (sleep desligado em /etc/systemd/sleep.conf.d).
# Sem DPMS por enquanto (bugs abertos com amdgpu + HDMI + hyprlock).
general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = pkill -USR1 -x hyprlock
    before_sleep_cmd = loginctl lock-session
}

# 10 min sem input local; ignore_inhibit para vídeo/wake-lock no navegador dos agentes não impedir o lock
listener {
    timeout = 600
    ignore_inhibit = true
    on-timeout = pidof hyprlock || hyprlock
}
