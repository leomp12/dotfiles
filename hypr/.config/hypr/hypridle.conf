# hypridle — só trava, nunca suspende (sleep desligado em /etc/systemd/sleep.conf.d).
# Desliga a tela (DPMS) só com o hyprlock ativo; tecla/mouse religa e mostra o campo de senha.
# Se o monitor não voltar (bugs conhecidos amdgpu + HDMI + DPMS): via SSH, ~/.bin/unlock-screen ou
# hyprctl dispatch 'hl.dsp.dpms({action = "on"})'.
general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = pkill -USR1 -x hyprlock
    before_sleep_cmd = loginctl lock-session
}

# 30 min sem input local; ignore_inhibit para vídeo/wake-lock no navegador dos agentes não impedir o lock
listener {
    timeout = 1800
    ignore_inhibit = true
    on-timeout = pidof hyprlock || hyprlock
}

# Tela travada há 2 min sem input → desliga o monitor (cobre o SUPER+L manual)
listener {
    timeout = 120
    ignore_inhibit = true
    on-timeout = pidof hyprlock >/dev/null && hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Mesmo para o lock automático dos 30 min (o listener de 2 min já disparou nesse período ocioso)
listener {
    timeout = 1920
    ignore_inhibit = true
    on-timeout = pidof hyprlock >/dev/null && hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
