<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Sans padrão: Adwaita Sans (a Inter do GNOME, com o "l" desambiguado), a mesma da UI do GTK.
     A Noto Sans fica de fallback para os glifos que faltarem. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
</fontconfig>
