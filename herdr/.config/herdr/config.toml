onboarding = false
# herdr (multiplexador de agentes)
# Referência: `herdr --default-config` e https://herdr.dev/docs/configuration/

[update]
# Instalado via pacman (AUR herdr-bin): atualizar com yay, nunca `herdr update`.
# O check em background só avisa; não baixa nada.
version_check = true

[worktrees]
# Worktrees fora dos snapshots do snapper (~/code é subvolume aninhado em @home).
directory = "~/code/_worktrees"

[ui]
# Nova aba já nasce com nome gerado, sem perguntar.
prompt_new_tab_name = false
pane_borders = "always"  # moldura e respiro abaixo da barra de abas mesmo com um pane só

[ui.sidebar.agents.rows_by_agent]
# Claude Code põe o título da sessão no título do terminal; mostra isso na sidebar.
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[keys]
# prefix+n cria space (abas: Alt+1..9; panes: Alt+←/→; spaces: Alt+↑/↓)
new_workspace = "prefix+n"
new_tab = ["prefix+t", "prefix+c"]  # t de tab; c mantido como padrão do tmux
previous_tab = ""  # sem atalho: aba é Alt+1..9 (o padrão prefix+n bateria com new_workspace)
next_tab = ""
focus_pane_left = ["prefix+h", "alt+left"]  # Alt+←/→ foca o pane ao lado na mesma aba
focus_pane_right = ["prefix+l", "alt+right"]
previous_workspace = "alt+up"  # Alt+↑/↓ troca de space
next_workspace = "alt+down"
cycle_pane_next = "alt+tab"  # alterna entre panes divididos sem prefixo
# Alt+Q/Alt+A espelham Super+Q (kitty) e Super+A (Claude Code) do Hyprland, só que como split na aba atual.
# O herdr pega as teclas antes de qualquer app no pane: some o push-line (Alt+Q) e o accept-and-hold (Alt+A) do zsh,
# e Meta+Q/Meta+A não chegam a vim/TUIs (o Claude Code não usa nenhum dos dois por padrão).
split_vertical = ["prefix+v", "alt+q"]

[keys.indexed]
# Alt+1..9 vai direto para a aba N do space atual (Super é do Hyprland, Alt fica livre)
tabs = "alt"

[[keys.command]]
key = "alt+a"
type = "shell"
description = "split com Claude Code"
# mesmo caminho do Super+A (nome de agente, espera o prompt, avisa erro por notify-send)
command = '"$HOME/.bin/herdr-open" --split "${HERDR_ACTIVE_PANE_CWD:-$HOME}"'
