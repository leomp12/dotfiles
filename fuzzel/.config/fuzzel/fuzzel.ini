# fuzzel — lançador (SUPER+R) e seletor dmenu (clipboard, etc.)
[main]
font=JetBrainsMono Nerd Font:size=12
terminal=kitty -e
prompt="❯ "
width=50
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8
icons-enabled=yes

[colors]
# paleta navy dos wallpapers/Hyprland (README: "Paleta")
background=15233dee
text=dbe4f2ff
prompt=9db4d6ff
input=e6edf7ff
match=9db4d6ff
selection=2e4570ff
selection-text=e6edf7ff
selection-match=9db4d6ff
border=9db4d6ff

[border]
width=2
radius=6
